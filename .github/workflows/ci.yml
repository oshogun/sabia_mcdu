name: CI

# windows-latest is the only viable runner: the client is a Tauri app that needs
# MSVC, WebView2 and the SimConnect-facing sidecar, none of which build on ubuntu.
on: [push, pull_request]

# Least privilege by default; only the release job widens this to contents: write.
permissions:
  contents: read

# Supersede in-progress runs for a branch - but never for a tag: cancelling a
# release run mid-flight is how you get a half-published release. Note this does
# NOT deduplicate the push + pull_request double-run of a same-repo PR: those two
# runs have different refs (refs/heads/... and refs/pull/N/merge), so they land in
# different groups. Narrow the triggers if the Windows-runner minutes matter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Node, sidecar, UI and gauge checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Two lockfiles: the root one is the private dev harness (gauge preview,
      # boundary and contract checks), sidecar/ is the shipped code.
      - name: Install root dependencies
        shell: pwsh
        run: npm ci

      # The sidecar's better-sqlite3 (the navdata cache driver) is a native
      # module. Its 12.11.1 release publishes a prebuild for node-v137, which
      # is Node 24's ABI (confirmed: `node -p process.versions.modules` on
      # 24.21.0 prints 137), so `npm ci` below takes prebuild-install and
      # never falls through to `node-gyp rebuild` - no Visual Studio pin, no
      # Python setup, no npm-version workaround needed on this runner. That
      # also matches what the user actually runs: src-tauri spawns plain
      # `node`, and after this change that is Node 24 too, so the shipped
      # binding and the sidecar's runtime ABI agree.
      #
      # The assertion below is still the real gate, not this comment: the
      # sidecar loads the SQLite driver lazily and fails soft, so if the
      # prebuild fetch ever regresses (registry outage, npm's install-scripts
      # allowlist gating denying it, a future better-sqlite3 dropping the
      # node-v137 asset), a missing module would otherwise disable navdata in
      # silence, and the release job would attach exactly that installer to a
      # public Release.
      #
      # The `rust` and `release` jobs carry a short comment pointing back here.
      # KEEP IN SYNC.
      - name: Install sidecar dependencies
        shell: pwsh
        run: npm --prefix sidecar ci

      # Proof, not trust. Loading the module (and running one query through it)
      # is the only thing that distinguishes a real build from the fail-soft
      # path where navdata just quietly disappears. A future regression must
      # fail this job instead of shipping.
      - name: Assert better-sqlite3 really built
        shell: pwsh
        working-directory: sidecar
        run: |
          node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); const v = db.prepare('select sqlite_version() as v').get().v; db.close(); console.log('better-sqlite3 loaded, SQLite ' + v)"

      - name: Sidecar typecheck
        shell: pwsh
        run: npm --prefix sidecar run typecheck

      # tests/uplink.test.ts spawns `openssl` to mint a self-signed certificate.
      # Windows has no openssl on PATH, but Git for Windows ships one and the
      # runner is guaranteed to have Git (actions/checkout needs it), so add its
      # usr\bin to the PATH for the remaining steps. Do not install OpenSSL.
      - name: Put Git's usr\bin (openssl) on PATH
        shell: pwsh
        run: |
          $gitUsrBin = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path -LiteralPath $gitUsrBin)) {
            Write-Output "::error::$gitUsrBin does not exist on this runner; the sidecar TLS tests cannot get an openssl."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin -Encoding utf8

      # Fail fast and loudly. Without openssl, tests/uplink.test.ts fails the file
      # with "spawnSync openssl ENOENT" AND four TLS tests report as *skipped* -
      # a skip must never be read as a pass, so assert the binary is really there
      # before the suite runs.
      - name: Assert openssl is available
        shell: pwsh
        run: |
          $v = openssl version
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v)) {
            Write-Output "::error::openssl is not callable; the sidecar TLS tests would skip instead of running."
            exit 1
          }
          Write-Output $v

      # Must run from pwsh, never bash. Under Git Bash with a lowercase drive
      # working directory (/c/...) vitest fails every file with
      # "Cannot read properties of undefined (reading 'config')".
      - name: Sidecar unit tests
        shell: pwsh
        run: npm --prefix sidecar test

      - name: Rust/webview contract check
        shell: pwsh
        run: node tools/contract-check.mjs

      - name: UI boundary rules
        shell: pwsh
        run: npm run check:ui

      - name: Preview harness tests
        shell: pwsh
        run: npm run test:gauge

      # Deliberately NOT run here: ui/tools/render-check.mjs and
      # ui/tools/host-swap-check.mjs. Both need puppeteer, which this project
      # does not install on purpose (no headless Chromium download in the repo
      # or on a runner). Those two checks are therefore unverified in CI by
      # design; run them locally only if you have puppeteer yourself.

  rust:
    name: Rust format and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Never pass --offline here. The repo's local notes use it because deps are
      # already vendored on the maintainer's machine; a fresh runner has nothing
      # to be offline with. Cache instead - a cold Tauri dependency build is slow.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # First, because it is seconds and needs none of the Node setup below.
      - name: cargo fmt
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Even `cargo test` needs a built sidecar. tauri.conf.json declares
      # ../sidecar/dist, ../sidecar/node_modules and ../sidecar/package.json as
      # bundle resources, and tauri-build's build script fails the crate with
      # "resource path `..\sidecar\dist` doesn't exist" when one is missing.
      # beforeDevCommand/beforeBuildCommand build the sidecar for `cargo tauri
      # dev|build`, but a plain cargo invocation runs neither, and on the
      # maintainer's machine those directories already exist - which is why this
      # only ever fails on a fresh runner. `cargo fmt` passes regardless because
      # it does not run build scripts.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # See the long comment in the `checks` job: better-sqlite3 has a Node 24
      # prebuild (node-v137), so `npm ci` below just downloads it - no Visual
      # Studio or Python setup needed. KEEP IN SYNC with that block.
      - name: Install sidecar dependencies (a declared bundle resource)
        shell: pwsh
        run: npm --prefix sidecar ci

      - name: Assert better-sqlite3 really built
        shell: pwsh
        working-directory: sidecar
        run: |
          node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); const v = db.prepare('select sqlite_version() as v').get().v; db.close(); console.log('better-sqlite3 loaded, SQLite ' + v)"

      - name: Build the sidecar (creates sidecar/dist)
        shell: pwsh
        run: npm --prefix sidecar run build

      # The process tests use real sleeps (about 12 s); that is expected.
      - name: cargo test
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    name: Publish GitHub Release from the annotated tag
    runs-on: windows-latest
    needs: [checks, rust]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A lightweight tag must never be published. For a lightweight tag the ref
      # resolves straight to the commit, so %(contents:subject) and
      # %(contents:body) return the COMMIT's subject and body - testing for an
      # empty subject cannot detect one, and the Release would come out titled
      # with whatever the head commit happened to say. Verified locally:
      #   git tag vLIGHT; git tag -l vLIGHT --format='%(objecttype)'  -> commit
      #   git tag -a vANNOT -m ...; ... --format='%(objecttype)'      -> tag
      # So test the object type, and fail the job before anything is built or
      # published - a wrongly titled public Release is worse than no Release.
      - name: Require an annotated tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          # actions/checkout@v7 still fetches the ref as a plain commit object,
          # not the annotated tag object - v7's only new fork-PR restriction is
          # for pull_request_target/workflow_run, which a tag push is neither
          # of, and it does not change tag-object fetching. So the ref can
          # still resolve as a lightweight tag here, which would make this
          # very check lie. Re-fetch the real tag object first.
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not fetch the tag object for $tag; refusing to judge the tag from a possibly degraded ref."
            exit 1
          }
          $type = (git cat-file -t "refs/tags/${tag}" | Out-String).Trim()
          if ($type -ne 'tag') {
            Write-Output "::error::$tag is a $type, not an annotated tag, so it carries no release title or notes of its own. Delete it (git tag -d $tag; git push --delete origin $tag) and re-tag with 'git tag -a $tag'. Nothing has been built or published."
            exit 1
          }
          # Second guard: an annotated tag whose message is empty.
          $subject = (git tag -l $tag --format='%(contents:subject)' | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($subject)) {
            Write-Output "::error::Annotated tag $tag has an empty message, so there is no Release title or notes. Re-tag with a one-line subject, a blank line, then the notes body."
            exit 1
          }
          # Third guard: a title wrapped onto a second line. %(contents:subject) is
          # the first *paragraph*, folded into one line, and the folded lines then
          # vanish from the notes - so both title and notes come out wrong, with no
          # warning. Verified locally: a two-line title returns as
          # "Title that wraps onto a second line" while %(contents) line 1 is
          # "Title that wraps". Comparing them detects it exactly.
          $firstLine = ((git tag -l $tag --format='%(contents)' | Out-String) -split "`r?`n")[0].Trim()
          if ($subject -ne $firstLine) {
            Write-Output "::error::Tag $tag has a title that wraps onto more than one line, so the Release title would be '$subject' and those lines would be missing from the notes. Re-tag with the title on a single line followed by a blank line."
            exit 1
          }
          Write-Output "Annotated tag ${tag}: ${subject}"

      # Every shipped version field must equal the tag. The root package.json is
      # intentionally unversioned (private dev harness) and is not checked.
      # There is no jq on windows-latest, so this is pure pwsh.
      - name: Verify tag matches every version field
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $want = $tag -replace '^v', ''
          $cargoToml = (Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $tauriConf = (Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $sidecarPkg = (Get-Content -Raw 'sidecar/package.json' | ConvertFrom-Json).version
          $sidecarSrc = (Select-String -Path 'sidecar/src/index.ts' -Pattern "^const SIDECAR_VERSION = '(.+)';" |
            Select-Object -First 1).Matches[0].Groups[1].Value
          # The crate's own entry in Cargo.lock, not any dependency's.
          $cargoLockRaw = Get-Content -Raw 'src-tauri/Cargo.lock'
          $cargoLock = [regex]::Match($cargoLockRaw,
            '(?m)^\[\[package\]\]\r?\nname = "msfslogger-windows-client"\r?\nversion = "([^"]+)"').Groups[1].Value
          # Read package-lock.json with regexes, NOT ConvertFrom-Json: the file has
          # a property with an empty name (packages[""]), which PowerShell's JSON
          # deserialiser rejects ("the value of argument name is not valid").
          $sidecarLockRaw = Get-Content -Raw 'sidecar/package-lock.json'
          $sidecarLock = [regex]::Match($sidecarLockRaw, '(?m)^  "version": "([^"]+)"').Groups[1].Value
          $sidecarLockPkg = [regex]::Match($sidecarLockRaw,
            '(?s)"packages":\s*\{\s*"":\s*\{[^{}]*?"version":\s*"([^"]+)"').Groups[1].Value
          $fields = [ordered]@{
            'src-tauri/Cargo.toml'                        = $cargoToml
            'src-tauri/tauri.conf.json'                   = $tauriConf
            'src-tauri/Cargo.lock (own package entry)'    = $cargoLock
            'sidecar/package.json'                        = $sidecarPkg
            'sidecar/package-lock.json (top level)'       = $sidecarLock
            'sidecar/package-lock.json (packages[""])'    = $sidecarLockPkg
            'sidecar/src/index.ts (SIDECAR_VERSION)'      = $sidecarSrc
          }
          $bad = $false
          foreach ($f in $fields.GetEnumerator()) {
            if ($f.Value -ne $want) {
              Write-Output "::error::Tag $tag (version $want) does not match $($f.Key), which reads '$($f.Value)'"
              $bad = $true
            } else {
              Write-Output "$($f.Key) = $($f.Value)"
            }
          }
          if ($bad) { exit 1 }

      - name: Skip if release already exists
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists, skipping."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.existing.outputs.skip == 'false'

      - uses: Swatinem/rust-cache@v2
        if: steps.existing.outputs.skip == 'false'
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        if: steps.existing.outputs.skip == 'false'
        with:
          node-version: 24

      # See the long comment in the `checks` job: better-sqlite3 has a Node 24
      # prebuild (node-v137), so `npm ci` below just downloads it - no Visual
      # Studio or Python setup needed. It matters most here - an installer
      # whose better-sqlite3 did not load ships with navdata silently dead.
      # KEEP IN SYNC with that block.

      # The bundle embeds sidecar/dist, sidecar/node_modules and
      # sidecar/package.json as they are on disk at build time, so a full install
      # (dev deps included - tsc runs in beforeBuildCommand) must happen first.
      # A partial or --omit=dev node_modules ships a broken sidecar.
      - name: Install sidecar dependencies for the bundle
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        run: npm --prefix sidecar ci

      # The last gate before a public Release: the exact node_modules that is
      # about to be embedded must contain a loadable better-sqlite3.
      - name: Assert better-sqlite3 really built
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        working-directory: sidecar
        run: |
          node -e "const D = require('better-sqlite3'); const db = new D(':memory:'); const v = db.prepare('select sqlite_version() as v').get().v; db.close(); console.log('better-sqlite3 loaded, SQLite ' + v)"

      - name: Install the Tauri CLI
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2.11" --locked
          } else {
            cargo tauri --version
          }

      # Fail loudly on a stale Cargo.lock instead of letting the build rewrite it
      # silently. This resolves only - it does not compile - so it costs seconds
      # and runs before the long build. It is a separate step rather than
      # `cargo tauri build -- --locked` so the failure is unambiguous and does not
      # depend on the Tauri CLI's argument passthrough.
      - name: Verify Cargo.lock is up to date
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml | Out-Null

      - name: Build the installer
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        run: cargo tauri build

      # productName carries an acute accent, so the artefact names are non-ASCII
      # (for example "Sabia_1.0.0_x64_en-US.msi" with the accent). Always glob;
      # never build the filename from strings.
      - name: Collect the installers
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist-release' | Out-Null
          $msi = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)
          if ($msi.Count -eq 0) {
            Write-Output "::error::No MSI found under src-tauri/target/release/bundle/msi"
          }
          if ($nsis.Count -eq 0) {
            Write-Output "::error::No NSIS setup .exe found under src-tauri/target/release/bundle/nsis"
          }
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) { exit 1 }
          foreach ($f in ($msi + $nsis)) {
            Copy-Item -LiteralPath $f.FullName -Destination 'dist-release'
            Write-Output "collected $($f.Name) ($([math]::Round($f.Length / 1MB, 1)) MB)"
          }

      # Uploaded before the Release step on purpose: a failed release must not
      # throw away a build this long. Both installers are unsigned.
      - name: Upload the installers as a workflow artifact
        if: steps.existing.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ github.ref_name }}
          path: dist-release/*
          if-no-files-found: error

      - name: Create the Release from the annotated tag and attach the installers
        if: steps.existing.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag messages may contain non-ASCII (the product name does), so read
          # git's output as UTF-8. --title has to stay an argument, hence this.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          # actions/checkout can leave an annotated tag as a lightweight ref, which
          # makes %(contents:subject) come back empty. Re-fetch the tag object.
          # (The "Require an annotated tag" step above has already proved this ref
          # is a real tag object with a non-empty subject.)
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          # NB %(contents:subject) folds a title wrapped over several lines into
          # one line and drops those lines from the body, so a tag message must
          # keep its title on a single line followed by a blank line.
          $subject = (git tag -l $tag --format='%(contents:subject)' | Out-String).Trim()
          $body = ((git tag -l $tag --format='%(contents:body)') -join "`n").Trim()
          # --notes-file, not --notes: an empty body would make `--notes ""`
          # collapse and silently promote the next argument (an installer path) to
          # the notes, losing that asset. A file also sidesteps quoting entirely.
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $body, (New-Object System.Text.UTF8Encoding($false)))
          $assets = @(Get-ChildItem -Path 'dist-release' -File | ForEach-Object { $_.FullName })
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag `
            --title $subject --notes-file $notesFile $assets
